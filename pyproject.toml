[build-system]
requires = ["setuptools>=64", "versioningit"] 
build-backend = "setuptools.build_meta" 


                                       
[project]
name = "katsdpcal"
description = "MeerKAT calibration pipeline"
readme = "README.md"
requires-python = ">=3.6"
license = {file = "LICENSE"}
keywords = ["kat", "kat7", "meerkat", "ska"]
authors = [
    {name = "MeerKAT SDP Team", email = "sdpdev+katsdpcal@ska.ac.za"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dynamic = ["version"]

dependencies = [
    "aiokatcp",
    "astropy",
    "async_timeout",
    "bokeh",
    "click==8.0",
    "cloudpickle==1.3.0",
    "dask[array,distributed]",
    "distributed==2.12.0",
    "docutils",
    "heapdict",
    "importlib-resources",
    "jsonschema",
    "matplotlib",
    "numba",
    "numpy",
    "psutil",
    "scipy",
    "sortedcontainers",
    "spead2",
    "tblib",
    "zict",
    "katpoint",
    "katdal",
    "katsdpcalproc",
    "katsdpmodels[requests]",
    "katsdptelstate",
    "katsdpservices[argparse,aiomonitor]",
    "katsdpsigproc"
]

[tool.versioningit]
write = {file = "src/katsdpcal/_version.py"}
default-version = "0.0.0"

[tool.versioningit.vcs]
method = "git"
match = ["v*"]
# Set a default tag for versioningit when no matching tags are found.
default-tag = "0.0.0"

[tool.versioningit.format]
distance =       "{base_version}.post1.dev{distance}+{branch}.{vcs}{rev}"
distance-dirty = "{base_version}.post1.dev{distance}+{branch}.{vcs}{rev}.dirty"
dirty =          "{base_version}+dirty"

[project.scripts]
run_cal = "scripts.run_cal:main"
sim_ts = "scripts.sim_ts:main_sync"
sim_data_stream = "scripts.sim_data_stream:main_sync"
create_test_data = "scripts.create_test_data:main"


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["katsdpcal*", "scripts*"]

[tool.setuptools.package-data]
katsdpcal = ["conf/*/*"]
