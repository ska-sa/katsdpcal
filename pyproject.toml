[build-system]
requires = ["setuptools"]  # greater than version 61 invludes non-python files 
build-backend = "setuptools.build_meta" 


                                       
[project]
name = "katsdpcal"
description = "MeerKAT calibration pipeline"
readme = "README.md"
requires-python = ">=3.6"
license = {file = "LICENSE"}
keywords = ["kat", "kat7", "meerkat", "ska"]
authors = [
    {name = "MeerKAT SDP Team", email = "sdpdev+katsdpcal@ska.ac.za"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dynamic = ["version"]
# remove the dependcies that were tied down to be very specific, we should leave lose requirements, like it should just import katdal and not clone the repo
dependencies = [
    "aiokatcp",
    "astropy",
    "async_timeout",
    "bokeh",
    "click==8.0",
    "cloudpickle==1.3.0",
    "dask[array,distributed]",
    "distributed==2.12.0",
    "docutils",
    "heapdict",
    "importlib-resources",
    "jsonschema",
    "matplotlib",
    "numba",
    "numpy",
    "psutil",
    "scipy",
    "sortedcontainers",
    "spead2",
    "tblib",        
    "zict",
    "katpoint",
    "katdal", 
    "katsdpcalproc",
    "katsdpmodels[requests]",
    "katsdptelstate",
    "katsdpservices[argparse,aiomonitor]",
    "katsdpsigproc"
]

# create project scripts table to make the scripts exceutable
